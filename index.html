<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurkeyVisited</title>
  <link rel="stylesheet" href="styles.css?v=visit-colors-2">

  <script src="vendor/d3.v5.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
</head>

<body>

  <button id="info_button" type="button" aria-label="Kullanım bilgisi" aria-controls="info_panel" aria-expanded="false">i</button>
  <aside id="info_panel" role="dialog" aria-label="Kullanım bilgisi" hidden>
    <button id="close_info" type="button" aria-label="Kapat">×</button>
  </aside>

  <div id="map_container"></div>

  <div id="year_box" class="year-box" hidden>
    <div id="year_display" hidden></div>
    <form id="year_form" hidden>
      <div><span id="year_city"></span> için ziyaret yılları</div>
      <div id="year_inputs"></div>
      <div class="year-actions">
        <button type="submit">Kaydet</button>
        <button id="remove_city" type="button">İşareti kaldır</button>
        <button id="add_year" type="button">Yeni yıl ekle</button>
        <button id="close_year_box" type="button">Kapat</button>
      </div>
    </form>
  </div>

  <div id="buttonGroup">
    <button id="reset_button" onclick="resetButton()">Sıfırla</button>
    <a id="github_logo" href="https://github.com/HMA-GR/Visited_Turkey" target="_blank" rel="noopener noreferrer"><img src="images/GitHub-Mark-32px.png" alt="GitHub deposu"></a>
  </div>
  <button id="download_button" onclick="downloadMap()">Haritayı İndir</button>

  <div id="city_count_text">Seçilen il sayısı:&nbsp;<span id="city_count">0</span>/81</div>

  <script src="turkeyvisited.js?v=visit-colors-2"></script>

</body>

</html>
